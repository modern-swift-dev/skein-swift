name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Release build
        run: swift build -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Release tests
        run: swift test -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            simulator-name: iPhone 17 Pro
            runtime-platform: iOS
          - platform: tvOS
            simulator-name: Apple TV 4K (3rd generation)
            runtime-platform: tvOS
          - platform: visionOS
            simulator-name: Apple Vision Pro
            runtime-platform: visionOS
          - platform: watchOS
            simulator-name: Apple Watch Series 11 (46mm)
            runtime-platform: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Ensure ${{ matrix.simulator-name }} simulator exists
        id: simulator
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_NAME: ${{ matrix.simulator-name }}
          RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
        run: |
          device_type_identifier="$(
            xcrun simctl list devicetypes --json |
              jq -er --arg name "$SIMULATOR_NAME" \
                'first(.devicetypes[] | select(.name == $name) | .identifier)'
          )"
          runtime_identifier="$(
            xcrun simctl list runtimes available --json |
              jq -er --arg platform "$RUNTIME_PLATFORM" '
                [
                  .runtimes[]
                  | select(.name | startswith($platform + " "))
                ]
                | sort_by(.version | split(".") | map(tonumber))
                | last
                | .identifier
              '
          )"

          if device_identifier="$(
            xcrun simctl list devices available --json |
              jq -er \
                --arg name "$SIMULATOR_NAME" \
                --arg runtime "$runtime_identifier" \
                'first(.devices[$runtime][] | select(.name == $name) | .udid)'
          )"; then
            echo "Using existing $SIMULATOR_NAME ($device_identifier)"
          else
            device_identifier="$(xcrun simctl create \
              "$SIMULATOR_NAME" \
              "$device_type_identifier" \
              "$runtime_identifier")"
          fi

          echo "device-id=$device_identifier" >> "$GITHUB_OUTPUT"
      - name: Build for ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          xcodebuild build -scheme Skein -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          xcodebuild build -scheme SkeinSwiftUI -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          xcodebuild test -scheme Skein-Package -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test examples
        if: matrix.platform == 'macOS'
        run: make test-examples
      - name: Report coverage
        if: matrix.platform == 'macOS'
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

          codecov_directory="$(dirname "$(swift test --show-codecov-path)")"
          bin_path="$(swift build --show-bin-path)"
          objects=()
          for bundle in "$bin_path"/*.xctest; do
            objects+=(-object "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)")
          done

          {
            echo '## Coverage'
            echo
            echo '```'
            xcrun llvm-cov report "${objects[@]}" \
              -instr-profile "$codecov_directory/default.profdata" \
              -ignore-filename-regex '(/\.build/|/Tests/)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  documentation:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26.6
        run: xcodebuild -version | grep -F 'Xcode 26.6'
      - name: Build documentation with warnings as errors
        run: make documentation
