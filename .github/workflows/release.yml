name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26.4.1
        run: xcodebuild -version | grep -F 'Xcode 26.4.1'
      - name: Build documentation
        run: make documentation
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          .build/documentation/Skein-Documentation.zip
          --verify-tag
          --generate-notes
